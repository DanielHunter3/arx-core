[package]
name = "arx-core"
version = "0.1.4"
edition = "2024"
description = "The Core of Packet Manager ARX"

repository = "https://github.com/DanielHunter3/arx-core"
readme = "README.md"
license = "AGPL-3.0"

[dependencies]

# Асинхронность и сети
tokio = { version = "1.35", features = ["full"] }     # асинхронность
reqwest = { version = "0.11", features = ["stream"] } # для загрузки

# Конфигурация
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

# Зависимости
pubgrub = "0.3"    # алгоритм разрешения зависимостей

# Сигнатуры и безопасность
ring = "0.17"           # криптография
async-signature = "0.3" # подписи

# -----------------------------------------
# ERROR HANDLE
# -----------------------------------------
thiserror = "2.0.17"
# -----------------------------------------
# {End} ERROR HANDLE {End}
# -----------------------------------------

# -----------------------------------------
# HASH
# -----------------------------------------
sha2 = "0.10"
blake2 = "0.10"
blake3 = "1.5"

hex = "0.4.3"

digest = "0.10"
typenum = "1.19.0"
# -----------------------------------------
# {End} HASH {End}
# -----------------------------------------

[dev-dependencies]
rand = "0.8"

[features]
default = ["user"]  # По умолчанию пользовательский режим
user = []           # Для разработки
system = []         # Для продакшена
